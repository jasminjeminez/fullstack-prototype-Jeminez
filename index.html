<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Full-Stack App (Student Build)</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Full-Stack App (Your Name)</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <!-- Shown only when NOT logged in -->
          <li class="nav-item" id="loginLink">
            <a class="nav-link" href="#">Login</a>
          </li>
          <li class="nav-item" id="registerLink">
            <a class="nav-link" href="#">Register</a>
          </li>

          <!-- Shown only when logged in -->
          <li class="nav-item dropdown d-none" id="userDropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="usernameDisplay"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Username
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">My Requests</a></li>
              <li><hr class="dropdown-divider role-admin" /></li>

              <!-- Admin-only links -->
              <li class="role-admin">
                <a class="dropdown-item" href="#">Employees</a>
              </li>
              <li class="role-admin">
                <a class="dropdown-item" href="#">Accounts</a>
              </li>
              <li class="role-admin">
                <a class="dropdown-item" href="#">Departments</a>
              </li>

              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item text-danger" href="#" id="logoutBtn"
                  >Logout</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content placeholder -->
  <div class="container mt-5">
    <h1>Welcome to the Full-Stack App</h1>
    <p>This is Phase 1 structure with role-based navigation.</p>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
